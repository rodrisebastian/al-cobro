<div class="login-page">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>AlCobro</mat-card-title>
      <mat-card-subtitle>Ingresá a tu cuenta</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" />
          @if (form.get('email')?.hasError('required')) {
            <mat-error>El email es obligatorio</mat-error>
          }
          @if (form.get('email')?.hasError('email')) {
            <mat-error>Ingresá un email válido</mat-error>
          }
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Contraseña</mat-label>
          <input matInput type="password" formControlName="password" />
          @if (form.get('password')?.hasError('required')) {
            <mat-error>La contraseña es obligatoria</mat-error>
          }
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit" class="full-width" [disabled]="form.invalid">
          Ingresar
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
